name: hanzo-sign-development

# Per-tenant SQLite via Hanzo Base — the database is an embedded file under
# BASE_PATH, so there is no database service here. These containers provide the
# supporting dev services (mail capture + S3-compatible object storage) only.
services:
  inbucket:
    image: inbucket/inbucket
    container_name: mailserver
    ports:
      - 9000:9000
      - 2500:2500
      - 1100:1100

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - 9002:9002
      - 9001:9001
    volumes:
      - minio:/data
    environment:
      MINIO_ROOT_USER: hanzo-sign
      MINIO_ROOT_PASSWORD: password
    entrypoint: sh
    command: -c 'mkdir -p /data/hanzo-sign && minio server /data --console-address ":9001" --address ":9002"'

volumes:
  minio:
