name: hanzo-sign-development

# Per-tenant SQLite via Hanzo Base — the database is an embedded file under
# BASE_PATH, so there is no database service here. These containers provide the
# supporting dev services (mail capture + S3-compatible object storage) only.
services:
  inbucket:
    image: inbucket/inbucket
    container_name: mailserver
    ports:
      - 9000:9000
      - 2500:2500
      - 1100:1100

  # Hanzo S3 (SeaweedFS-derived, Apache-2.0). The `mini` command is the
  # all-in-one dev server; S3_BUCKET pre-creates the bucket on startup, which
  # is what the old `mkdir -p /data/hanzo-sign` was doing. The S3 API stays on
  # 9002 because inbucket already owns 9000. There is no web console.
  s3:
    image: ghcr.io/hanzoai/s3:v1.0.14
    container_name: s3
    ports:
      - 9002:9002
    volumes:
      - s3:/data
    environment:
      AWS_ACCESS_KEY_ID: hanzo-sign
      AWS_SECRET_ACCESS_KEY: password
      S3_BUCKET: hanzo-sign
    command: mini -dir=/data -s3.port=9002

volumes:
  s3:
