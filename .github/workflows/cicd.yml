# Canonical caller — every knob lives in /hanzo.yml, none here.
# github.com is canonical and its linux-amd64 jobs run on the JIT runners in
# AWS (ns hanzo-ci); the image is built by the build door.
name: CI/CD
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  cicd:
    uses: hanzoai/ci/.github/workflows/build.yml@v2
    secrets: inherit
