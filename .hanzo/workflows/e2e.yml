# Playwright e2e against a real stack: services up, database migrated and
# seeded, then the suite.
#
# This is the ONE thing .github/workflows still did that the native lane does
# not. The other three files there were identical stubs echoing "moved to native
# pipeline" — a workflow that reports success for doing nothing, which is worse
# than no workflow, so they are gone.
#
# The label was warp-ubuntu-2204-x64-8x, a WarpBuild SaaS runner this fleet does
# not have. On the forge that queues rather than fails.
#
# .github/actions/{node-install,playwright-install} stay where they are and
# still resolve — a local action is a path in the repo, not a GitHub surface.
name: Playwright Tests
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e_tests:
    name: 'E2E Tests'
    timeout-minutes: 60
    runs-on: hanzo-build-linux-amd64

    # The suite needs one thing it does not carry itself: somewhere to send mail.
    # `npm run dx:up` is the local way and cannot work here — it reaches the
    # runner's docker socket, so inbucket comes up as a SIBLING of this job with
    # 2500 published on the docker host, while the job runs in its own container
    # on its own network. 127.0.0.1:2500 in here is nothing, which is the
    # `connect ECONNREFUSED 127.0.0.1:2500` behind the resend endpoint answering
    # 500. A service container joins this job's network and answers on its name.
    #
    # dx:up's other container, minio, is not needed: uploads go to the database
    # (NEXT_PUBLIC_UPLOAD_TRANSPORT) and the database is a SQLite file.
    services:
      mailserver:
        image: inbucket/inbucket
        ports:
          - '2500:2500'

    steps:
      - uses: actions/checkout@v4

      - name: Copy env
        run: cp .env.example .env

      - uses: ./.github/actions/node-install

      - uses: ./.github/actions/playwright-install

      - name: Create the database
        run: npm run prisma:migrate-dev

      - name: Seed the database
        run: npm run prisma:seed

      - name: Install playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm run ci
        env:
          # Needed since we use next start which will set the NODE_ENV to production
          NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH: './example/cert.p12'
          DANGEROUS_BYPASS_RATE_LIMITS: 'true'
          # .env.example points at 127.0.0.1 for the local dx:up mailserver; here
          # it is the service above. dotenv leaves an existing variable alone, so
          # this wins over the file.
          NEXT_PRIVATE_SMTP_HOST: 'mailserver'

      # v3, not v4: @actions/artifact v2 (which upload-artifact v4 uses) refuses
      # to run against anything it does not recognise as github.com and fails
      # with GHESNotSupportedError. That failed the job on its own, so a green
      # suite would still have reported red. The forge keeps artifacts for 30
      # days and serves the v3 protocol.
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results
          path: 'packages/app-tests/**/test-results/*'
          retention-days: 7
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
